name: Build shiny Docker image and generate Galaxy wrapper

on:
  workflow_dispatch:
  push:
    branches: devel
    paths:
      - 'DESCRIPTION'

jobs:
  check-wrapper:
    runs-on: ubuntu-latest
    outputs:
      wrapper_missing: ${{ steps.check.outputs.missing }}
      manual: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if wrapper exists
        id: check
        run: |
          if [ -f ./galaxy-wrapper.xml ]; then
            echo "missing=false" >> $GITHUB_OUTPUT
          else
            echo "missing=true" >> $GITHUB_OUTPUT
          fi

  build-push:
    runs-on: ubuntu-latest
    outputs:
      container: ${{ steps.vars.outputs.container }}
      source: ${{ steps.vars.outputs.source }}
      name: ${{ steps.vars.outputs.name }}
      id: ${{ steps.vars.outputs.id }}
    steps:
      - name: Extract metadata for container image
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value={{branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          platforms: linux/amd64

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image to ghcr
        uses: docker/build-push-action@v4
        with:
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Set variables
        id: vars
        run: |
          echo "container=${{ steps.meta.outputs.tags }}" >> $GITHUB_OUTPUT
          echo "source=https://github.com/${{github.repository}}" >> $GITHUB_OUTPUT
          NAME="$(echo '${{github.repository}}' | awk -F'/' '{print $2}')"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "id=$(echo $NAME | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

  update-certs-site:
    needs: [build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: save kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install Kubectl
        run: |
          set -euo pipefail
          curl -sSLO kubectl "https://storage.googleapis.com/kubernetes-release/release/v1.24.4/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mv kubectl /usr/local/bin/kubectl

      - name: Verify Kubernetes auth
        shell: bash
        run: |
          set -euo pipefail
          kubectl config current-context
          kubectl cluster-info
          kubectl auth can-i get pods -n certs

      - name: Clean up old pod
        shell: bash
        run: |
          set -euo pipefail
          sleep 60
          kubectl get pod -n certs -o name | xargs -r -I{} kubectl delete -n certs {}

  generate-wrapper:
    needs: [check-wrapper, build-push]
    if: needs.check-wrapper.outputs.wrapper_missing == 'true' || needs.check-wrapper.outputs.manual == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate wrapper
        run: |
          cp .github/scripts/galaxy-wrapper-template.xml galaxy-wrapper.xml
          sed -i 's#{{{CONTAINER}}}#${{ needs.build-push.outputs.container }}#g' galaxy-wrapper.xml
          sed -i 's#{{{SOURCE}}}#${{ needs.build-push.outputs.source }}#g' galaxy-wrapper.xml
          sed -i 's#{{{NAME}}}#${{ needs.build-push.outputs.name }}#g' galaxy-wrapper.xml
          sed -i 's#{{{ID}}}#${{ needs.build-push.outputs.id }}#g' galaxy-wrapper.xml
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add galaxy-wrapper.xml
          git commit -m "Update Galaxy Wrapper $(TZ=EST date '+%Y-%m-%d_%H-%M')" && git push || true
